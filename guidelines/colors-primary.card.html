<!-- @dsCard group="Colors" viewport="700x220" name="Primary Palette" subtitle="Forest green + golden amber — the brand's core colors" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-offwhite); font-family: var(--font-primary); padding: 24px; }
    .row { display: flex; gap: 8px; }
    .swatch { flex: 1; border-radius: 2px; }
    .label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 8px; color: var(--color-gray-600); }
    .hex   { font-size: 12px; font-weight: 500; color: var(--color-black); margin-top: 2px; }
    .name  { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-gray-400); margin-bottom: 12px; }
  </style>
</head>
<body>
  <div style="display:flex;gap:48px;">
    <div style="flex:1">
      <div class="name">Verde Floresta</div>
      <div class="row">
        <div>
          <div class="swatch" style="height:80px;background:var(--color-green-500);"></div>
          <div class="label">500</div><div class="hex">#3E7853</div>
        </div>
        <div>
          <div class="swatch" style="height:80px;background:var(--color-green-300);"></div>
          <div class="label">300</div><div class="hex">#8DAA91</div>
        </div>
        <div>
          <div class="swatch" style="height:80px;background:var(--color-green-200);"></div>
          <div class="label">200</div><div class="hex">#B8C9BA</div>
        </div>
        <div>
          <div class="swatch" style="height:80px;background:var(--color-green-100);"></div>
          <div class="label">100</div><div class="hex">#DDE8DF</div>
        </div>
        <div>
          <div class="swatch" style="height:80px;background:var(--color-green-50);border:1px solid #e0e0e0;"></div>
          <div class="label">50</div><div class="hex">#EEF4EF</div>
        </div>
      </div>
    </div>
    <div style="flex:1">
      <div class="name">Âmbar Dourado</div>
      <div class="row">
        <div>
          <div class="swatch" style="height:80px;background:var(--color-gold-500);"></div>
          <div class="label">500</div><div class="hex">#DDB830</div>
        </div>
        <div>
          <div class="swatch" style="height:80px;background:var(--color-gold-300);"></div>
          <div class="label">300</div><div class="hex">#EED47C</div>
        </div>
        <div>
          <div class="swatch" style="height:80px;background:var(--color-gold-200);"></div>
          <div class="label">200</div><div class="hex">#F5E5A8</div>
        </div>
        <div>
          <div class="swatch" style="height:80px;background:var(--color-gold-100);"></div>
          <div class="label">100</div><div class="hex">#FAF1C5</div>
        </div>
        <div>
          <div class="swatch" style="height:80px;background:var(--color-gold-50);border:1px solid #e0e0e0;"></div>
          <div class="label">50</div><div class="hex">#FDF8E5</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
