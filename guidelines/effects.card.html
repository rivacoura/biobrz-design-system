<!-- @dsCard group="Spacing" viewport="700x180" name="Effects — Radius & Shadow" subtitle="Geometric precision: minimal rounding, restrained shadows" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-offwhite); font-family: var(--font-primary); padding: 24px; }
    .section { display: flex; gap: 24px; align-items: flex-end; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .box { width: 64px; height: 64px; background: var(--color-white); border: 1.5px solid var(--color-green-200); }
    .label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-gray-600); text-align: center; }
    .val { font-size: 10px; color: var(--color-gray-400); font-family: monospace; }
    .divider { width: 1px; background: var(--color-green-100); height: 80px; margin: 0 12px; align-self: center; }
    .shadow-box { width: 64px; height: 64px; background: var(--color-white); border-radius: 2px; }
  </style>
</head>
<body>
  <div style="display:flex;gap:48px;">
    <div>
      <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-gray-400);margin-bottom:14px;">Bordas Arredondadas</div>
      <div class="section">
        <div class="item"><div class="box" style="border-radius:0px;"></div><div class="label">None</div><div class="val">0px</div></div>
        <div class="item"><div class="box" style="border-radius:2px;"></div><div class="label">XS</div><div class="val">2px</div></div>
        <div class="item"><div class="box" style="border-radius:4px;"></div><div class="label">SM</div><div class="val">4px</div></div>
        <div class="item"><div class="box" style="border-radius:6px;"></div><div class="label">MD</div><div class="val">6px</div></div>
        <div class="item"><div class="box" style="border-radius:12px;"></div><div class="label">LG</div><div class="val">12px</div></div>
        <div class="item"><div class="box" style="border-radius:100px;width:64px;"></div><div class="label">Pill</div><div class="val">100px</div></div>
      </div>
    </div>
    <div>
      <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-gray-400);margin-bottom:14px;">Sombras</div>
      <div class="section">
        <div class="item"><div class="shadow-box" style="box-shadow:var(--shadow-xs);"></div><div class="label">XS</div></div>
        <div class="item"><div class="shadow-box" style="box-shadow:var(--shadow-sm);"></div><div class="label">SM</div></div>
        <div class="item"><div class="shadow-box" style="box-shadow:var(--shadow-md);"></div><div class="label">MD</div></div>
        <div class="item"><div class="shadow-box" style="box-shadow:var(--shadow-lg);"></div><div class="label">LG</div></div>
        <div class="item"><div class="shadow-box" style="box-shadow:var(--shadow-green-md);"></div><div class="label">Green</div></div>
      </div>
    </div>
  </div>
</body>
</html>
