<!-- @dsCard group="Type" viewport="700x190" name="Font Weights" subtitle="Barlow weight spectrum — 300 Light through 700 Bold" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-offwhite); font-family: var(--font-primary); padding: 24px; }
    .row { display: flex; align-items: center; gap: 20px; padding: 7px 0; border-bottom: 1px solid var(--color-green-100); }
    .row:last-child { border-bottom: none; }
    .meta { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-gray-400); min-width: 100px; }
    .weight-num { font-size: 10px; color: var(--color-gray-400); min-width: 32px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="row"><div class="meta">Light</div><div class="weight-num">300</div><div style="font-size:22px;font-weight:300;color:var(--color-black);">Todo patrimônio carrega uma história.</div></div>
  <div class="row"><div class="meta">Regular</div><div class="weight-num">400</div><div style="font-size:22px;font-weight:400;color:var(--color-black);">Todo patrimônio carrega uma história.</div></div>
  <div class="row"><div class="meta">Medium</div><div class="weight-num">500</div><div style="font-size:22px;font-weight:500;color:var(--color-black);">Todo patrimônio carrega uma história.</div></div>
  <div class="row"><div class="meta">Semibold</div><div class="weight-num">600</div><div style="font-size:22px;font-weight:600;color:var(--color-black);">Todo patrimônio carrega uma história.</div></div>
  <div class="row"><div class="meta">Bold</div><div class="weight-num">700</div><div style="font-size:22px;font-weight:700;color:var(--color-black);">Todo patrimônio carrega uma história.</div></div>
</body>
</html>
