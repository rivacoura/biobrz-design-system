<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-offwhite); font-family: var(--font-primary); padding: 28px 24px; }
    .row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--color-green-100); }
    .row:last-child { border-bottom: none; }
    .meta { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-gray-400); min-width: 80px; }
    .sample { color: var(--color-black); line-height: 1.1; }
  </style>
</head>
<body>
  <div class="row">
    <div class="meta">Display</div>
    <div class="sample" style="font-size:56px;font-weight:400;letter-spacing:0.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:10px;text-decoration-thickness:2px;">BioBrz</div>
  </div>
  <div class="row">
    <div class="meta">H1 · 56px</div>
    <div class="sample" style="font-size:46px;font-weight:400;letter-spacing:-0.015em;">Complexidade em Vantagem</div>
  </div>
  <div class="row">
    <div class="meta">H2 · 40px</div>
    <div class="sample" style="font-size:34px;font-weight:400;">Consultoria Tributária Estratégica</div>
  </div>
  <div class="row">
    <div class="meta">H3 · 32px</div>
    <div class="sample" style="font-size:28px;font-weight:400;">O imposto certo libera o crescimento</div>
  </div>
  <div class="row">
    <div class="meta">H4 · 24px</div>
    <div class="sample" style="font-size:22px;font-weight:400;">Quinze anos construindo em silêncio</div>
  </div>
  <div class="row">
    <div class="meta">H5 · 20px</div>
    <div class="sample" style="font-size:18px;font-weight:400;">Uma casa de alto padrão</div>
  </div>
</body>
</html>
