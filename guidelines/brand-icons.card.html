<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-offwhite); font-family: var(--font-primary); padding: 20px; }
    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--color-gray-400);
      margin-bottom: 12px; margin-top: 16px;
    }
    .section-label:first-child { margin-top: 0; }
    .grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .icon-item { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 60px; }
    .icon-box {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 2px;
    }
    .icon-name { font-size: 9px; color: var(--color-gray-400); text-align: center; line-height: 1.2; }
    img.icon { width: 20px; height: 20px; }
  </style>
</head>
<body>

  <div class="section-label">Serviços</div>
  <div class="grid">
    <div class="icon-item">
      <div class="icon-box" style="background: var(--color-green-50); border: 1px solid var(--color-green-100);">
        <img class="icon" src="../assets/icons/service-tax.svg" alt="tax" style="filter: invert(37%) sepia(40%) saturate(500%) hue-rotate(100deg) brightness(70%);">
      </div>
      <div class="icon-name">tax</div>
    </div>
    <div class="icon-item">
      <div class="icon-box" style="background: var(--color-gold-50); border: 1px solid var(--color-gold-100);">
        <img class="icon" src="../assets/icons/service-advisory.svg" alt="advisory" style="filter: invert(65%) sepia(60%) saturate(700%) hue-rotate(5deg) brightness(85%);">
      </div>
      <div class="icon-name">advisory</div>
    </div>
    <div class="icon-item">
      <div class="icon-box" style="background: var(--color-blue-100); border: 1px solid var(--color-blue-200);">
        <img class="icon" src="../assets/icons/service-audit.svg" alt="audit" style="filter: invert(55%) sepia(30%) saturate(400%) hue-rotate(185deg) brightness(85%);">
      </div>
      <div class="icon-name">audit</div>
    </div>
  </div>
