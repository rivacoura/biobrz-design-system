<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing Scale" subtitle="8px base grid — tokens --space-1 through --space-32" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-offwhite); font-family: var(--font-primary); padding: 24px; }
    .row { display: flex; align-items: flex-end; gap: 12px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .bar { background: var(--color-green-500); border-radius: 2px; width: 32px; }
    .label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-gray-600); text-align: center; }
    .px { font-size: 10px; color: var(--color-gray-400); }
  </style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;"></div><div class="label">1</div><div class="px">4px</div></div>
    <div class="item"><div class="bar" style="height:8px;"></div><div class="label">2</div><div class="px">8px</div></div>
    <div class="item"><div class="bar" style="height:12px;"></div><div class="label">3</div><div class="px">12px</div></div>
    <div class="item"><div class="bar" style="height:16px;"></div><div class="label">4</div><div class="px">16px</div></div>
    <div class="item"><div class="bar" style="height:20px;"></div><div class="label">5</div><div class="px">20px</div></div>
    <div class="item"><div class="bar" style="height:24px;"></div><div class="label">6</div><div class="px">24px</div></div>
    <div class="item"><div class="bar" style="height:32px;"></div><div class="label">8</div><div class="px">32px</div></div>
    <div class="item"><div class="bar" style="height:40px;"></div><div class="label">10</div><div class="px">40px</div></div>
    <div class="item"><div class="bar" style="height:48px;"></div><div class="label">12</div><div class="px">48px</div></div>
    <div class="item"><div class="bar" style="height:64px;background:var(--color-green-300);"></div><div class="label">16</div><div class="px">64px</div></div>
    <div class="item"><div class="bar" style="height:80px;background:var(--color-green-200);"></div><div class="label">20</div><div class="px">80px</div></div>
    <div class="item"><div class="bar" style="height:96px;background:var(--color-green-100);"></div><div class="label">24</div><div class="px">96px</div></div>
  </div>
</body>
</html>
