<!-- @dsCard group="Colors" viewport="700x160" name="Blue Mist Palette" subtitle="Azul névoa — precision, analysis, the Audit service" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-offwhite); font-family: var(--font-primary); padding: 24px; }
    .label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 8px; color: var(--color-gray-600); }
    .hex   { font-size: 12px; font-weight: 500; color: var(--color-black); margin-top: 2px; }
    .name  { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-gray-400); margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="name">Azul Névoa</div>
  <div style="display:flex;gap:8px;">
    <div>
      <div style="height:80px;width:100px;border-radius:2px;background:var(--color-blue-400);"></div>
      <div class="label">400</div><div class="hex">#B9CEDF</div>
    </div>
    <div>
      <div style="height:80px;width:100px;border-radius:2px;background:var(--color-blue-300);"></div>
      <div class="label">300</div><div class="hex">#C8D9E8</div>
    </div>
    <div>
      <div style="height:80px;width:100px;border-radius:2px;background:var(--color-blue-200);"></div>
      <div class="label">200</div><div class="hex">#D6E4EF</div>
    </div>
    <div>
      <div style="height:80px;width:100px;border-radius:2px;background:var(--color-blue-100);"></div>
      <div class="label">100</div><div class="hex">#E7F0F8</div>
    </div>
    <div style="margin-left:32px;padding:16px;background:var(--color-green-500);border-radius:4px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;">
      <div style="height:32px;width:80px;border-radius:2px;background:var(--color-blue-400);"></div>
      <div style="font-size:10px;color:rgba(255,255,255,0.7);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;text-align:center;">em verde</div>
    </div>
    <div style="padding:16px;background:#000;border-radius:4px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;">
      <div style="height:32px;width:80px;border-radius:2px;background:var(--color-blue-400);"></div>
      <div style="font-size:10px;color:rgba(255,255,255,0.5);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;text-align:center;">em preto</div>
    </div>
  </div>
</body>
</html>
